<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14100d">
  <meta name="description" content="One and One Story — a faithful HTML5 edition of the 2011 Flash game by Mattia Traverso.">
  <title>One and One Story</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="stage" class="stage">
      <canvas id="game" width="640" height="480" aria-label="One and One Story"></canvas>

      <div id="overlay" class="overlay"></div>

      <div id="narrative" class="narrative" aria-live="polite"></div>

      <div id="hud" class="hud is-hidden" aria-hidden="true">
        <button id="hudQuit" class="hud-icon hud-quit" type="button" aria-label="Quit to menu">
          <img src="assets/img/ui/icon-exit.png" alt="">
        </button>
        <button id="hudAudio" class="hud-icon hud-audio" type="button" aria-label="Toggle sound">
          <img id="hudAudioIcon" src="assets/img/ui/icon-audio-on.png" alt="">
        </button>
        <button id="hudRestart" class="hud-icon hud-restart" type="button" aria-label="Restart level">
          <img src="assets/img/ui/icon-restart.png" alt="">
        </button>
        <button id="hudSwitch" class="hud-icon hud-switch is-hidden" type="button" aria-label="Switch character">
          <img id="hudSwitchIcon" src="assets/img/ui/icon-switch-j2r.png" alt="">
        </button>
        <button id="hudHelp" class="hud-icon hud-help" type="button" aria-label="Open game guide">
          <img src="assets/img/ui/icon-help.png" alt="">
        </button>
        <div class="hud-level" id="hudLevel"></div>
      </div>

      <div id="touch" class="touch is-hidden" aria-hidden="true"></div>
      <div id="focusPause" class="focus-pause is-hidden" aria-hidden="true">
        <img src="assets/img/ui/pause-screen.png" alt="Game paused. Click anywhere to resume.">
      </div>
      <div id="fade" class="fade"></div>
    </div>
  </div>
  <div id="bootFallback" class="boot-fallback">
    <div class="boot-card">
      <div class="boot-title">One and One Story</div>
      <div id="bootMessage" class="boot-message">Loading…</div>
      <div class="boot-hint">
        If this message stays on screen, open the game in Chrome, Edge, Firefox or Safari
        with JavaScript enabled — or run <code>npm start</code> from the project folder.
      </div>
    </div>
  </div>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script>
    window.addEventListener("error", function (event) {
      var fallback = document.getElementById("bootFallback");
      var message = document.getElementById("bootMessage");
      if (!fallback) return;
      fallback.classList.remove("is-hidden");
      if (message) {
        message.textContent = "The game could not start: " + (event.message || "unknown error");
      }
    });
  </script>
  <script type="module" src="src/main.js"></script>
  <script>
    // Opening the source index.html directly from disk cannot load ES modules.
    // In that case, forward to the self-contained edition next to it.
    if (location.protocol === "file:" && !window.__ONE_AND_ONE_EMBEDDED__) {
      var target = new URL("dist/one-and-one-story.html", location.href);
      var boot = document.getElementById("bootMessage");
      if (boot) boot.textContent = "Opening the single-file edition…";
      location.replace(target.href);
    }
  </script>
</body>
</html>
